name: Build docker image

on:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

  pull_request:

# Runs of one event and branch or tag never overlap, so an older master run
# cannot finish last and move floating tags back. A newer pending run of the
# same event replaces an older one; other events never replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The monthly release and the extended support release (ESR).
  DISCOURSE_RELEASE: '2026.10.2'
  DISCOURSE_ESR: '2026.7.6'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      discourse-versions: ${{ steps.set-matrix.outputs.discourse-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "release", "version": "${{ env.DISCOURSE_RELEASE }}", "latest": "latest"},
            {"key": "esr", "version": "${{ env.DISCOURSE_ESR }}", "latest": ""}
          ]
          EOF
          echo "discourse-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        discourse: ${{ fromJson(needs.setup.outputs.discourse-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        env:
          DISCOURSE_VER: ${{ matrix.discourse.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Resolve architecture image
        id: arch-image
        if: github.event_name == 'push'
        env:
          DISCOURSE_VER: ${{ matrix.discourse.version }}
          ARCH: ${{ matrix.arch }}
        run: echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Push architecture image
        if: github.event_name == 'push'
        uses: wodby/images/.github/actions/arch-image-push@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
        with:
          image: ${{ steps.arch-image.outputs.image }}

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        discourse: ${{ fromJson(needs.setup.outputs.discourse-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: wodby/images/.github/actions/arch-image-pins@2da5f02ec3dffc5cb3331152e01e3c89874b0bfe
      - uses: ./.github/actions
        with:
          version: ${{ matrix.discourse.version }}
          latest: ${{ matrix.discourse.latest }}

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@aee656b81ae84e0dca0cfdbea173057abe4a9426
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
